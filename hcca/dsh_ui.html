<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCCA · DSH</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: var(--dsw-alias-bg-base, #11151c);
    --bg-elev: var(--dsw-alias-bg-l1, #1a202a);
    --bg-l2: var(--dsw-alias-bg-l2, #222b38);
    --border: var(--dsw-alias-border-l2, #29323f);
    --border-strong: var(--dsw-alias-border-l3, #3d4a5b);
    --text: var(--dsw-alias-label-primary, #e9edf4);
    --text-2: var(--dsw-alias-label-secondary, #adb8c8);
    --text-3: var(--dsw-alias-label-tertiary, #8995a8);
    --accent: var(--dsw-alias-brand-primary, #82aaff);
    --ok: #61c6a0;
    --warn: #e6b968;
    --bad: #ef8790;
    --idle: #8b949e;
    --radius: 12px;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.6 "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  button { -webkit-tap-highlight-color: transparent; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
  /* ---- top chrome: mirrors the DSH session header + view ring ---- */
  header.chrome { padding: 16px 22px; border-bottom: 1px solid var(--border); background: var(--bg); flex: none; }
  .crumbs { display: flex; align-items: center; gap: 16px; color: var(--text-2); font-size: 12px; min-width: 0; }
  .crumbs b { color: var(--text); font-weight: 600; flex: none; white-space: nowrap; }
  /* Task description must not stretch the header: one line + click to expand. */
  .goal-btn {
    flex: 1 1 auto; min-width: 0; text-align: left; background: none; border: 0; padding: 0;
    color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; cursor: pointer;
  }
  .goal-btn:hover { color: var(--text); }
  .goal-btn .caret { color: var(--text-3); font-size: 10px; margin-left: 4px; }
  .goal-full {
    position: absolute; top: 52px; left: 22px; width: min(700px, calc(100vw - 44px)); z-index: 6;
    margin: 8px 0 10px; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: 12px;
    box-shadow: 0 16px 48px #0004;
    background: var(--bg-elev); white-space: pre-wrap; color: var(--text-2); font-size: 12px;
    line-height: 1.55; max-height: 180px; overflow: auto; overflow-wrap: anywhere;
  }
  .goal-full[hidden] { display: none; }
  .chips { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: 11px; flex: none; }
  .chip { border: 1px solid var(--border); background: var(--bg-elev); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  #chipStatus { min-width: 64px; text-align: center; }
  #chipModel { max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
  .chip[data-status="RUNNING"], .chip[data-status="READY"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .chip[data-status="COMPLETED"] { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, var(--border)); }
  .chip[data-status="FAILED"], .chip[data-status="INCOMPLETE"], .chip[data-status="OFFLINE"] { color: var(--bad); }
  .chip .dot, .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); vertical-align: 1px; }
  .guidance { padding: 10px 22px; border-bottom: 1px solid var(--border); flex: none; }
  .guidance form { display: flex; gap: 10px; align-items: center; }
  .guidance label { color: var(--text-2); white-space: nowrap; }
  .guidance textarea { flex: 1; min-width: 0; resize: vertical; min-height: 38px; max-height: 140px; border: 1px solid var(--border-strong); border-radius: 7px; padding: 8px 10px; background: var(--bg-elev); color: var(--text); font: inherit; }
  .guidance button { border: 1px solid var(--border-strong); background: var(--bg-l2); border-radius: 7px; padding: 7px 14px; cursor: pointer; }
  .guidance button:disabled { opacity: .5; cursor: default; }
  .guidance-receipts { max-height: 100px; overflow: auto; color: var(--text-3); font-size: 11px; }
  .guidance-receipts p { margin: 5px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  #guidanceFeedback { font-size: 11px; color: var(--text-2); margin-top: 4px; }
  /* ---- body ---- */
  .body { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
  .canvas-wrap { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .metrics { display: flex; gap: 0; padding: 16px 10px; border-bottom: 1px solid var(--border); overflow-x: auto; flex: none; scrollbar-gutter: stable; }
  .metric { flex: 0 0 138px; padding: 0 14px; border-right: 1px solid var(--border); }
  .metric:last-child { border-right: 0; }
  .metric .k { color: var(--text-3); font-size: 11px; white-space: nowrap; }
  .metric .v { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.8; }
  .metric .v small { display: block; height: 16px; line-height: 16px; font-weight: 400; color: var(--text-2); font-size: 10px; }
  .graph-area { position: relative; flex: 1; min-height: 0; }
  .canvas { position: absolute; inset: 0; overflow: auto; cursor: grab; scrollbar-gutter: stable; overflow-anchor: none;
    background-image: radial-gradient(var(--border) .7px, transparent .7px); background-size: 22px 22px; }
  .canvas.panning { cursor: grabbing; }
  .canvas.panning .node { pointer-events: none; }
  .node {
    position: absolute; width: 192px; height: 104px; padding: 13px 14px; border-radius: var(--radius);
    border: 1px solid var(--border-strong); background: var(--bg-elev); cursor: pointer;
    box-shadow: 0 4px 12px #00000010; text-align: left;
    transition: border-color .15s, box-shadow .15s; user-select: none;
  }
  .node:hover { border-color: var(--text-3); }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 13%, transparent), 0 6px 20px #0002; }
  .node .row1 { display: flex; align-items: center; gap: 7px; }
  .node .glyph { width: 18px; height: 18px; flex: none; color: var(--text-2); }
  .node .name { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .role { color: var(--text-3); font-size: 11px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .foot { margin-top: 12px; display: flex; align-items: center; gap: 6px; color: var(--text-2); font-size: 10.5px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
  .st { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--idle); }
  .st.RUNNING { background: var(--warn); }
  .st.READY { background: var(--accent); }
  .st.WAITING { background: #a371f7; }
  .st.COMPLETED { background: var(--ok); }
  .st.FAILED, .st.CANCELLED, .st.INCOMPLETE, .st.INTERRUPTED { background: var(--bad); }
  .st.QUEUED, .st.CREATED { background: var(--idle); }
  .node .wait { background: var(--bg-l2); color: var(--text-2); border-radius: 5px; padding: 1px 5px; font-size: 10px; }
  svg.edges { position: absolute; left: 0; top: 0; pointer-events: none; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); font-size: 13px; text-align: center; padding: 24px; white-space: pre-line; }
  .empty[hidden] { display: none !important; }
  .legend { position: absolute; left: 16px; bottom: 14px; display: flex; gap: 12px; color: var(--text-3); font-size: 10px; background: var(--bg); border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .toolbar { position: absolute; right: 16px; top: 14px; display: flex; gap: 6px; z-index: 3; }
  .toolbar button { border: 1px solid var(--border); background: var(--bg-elev); color: var(--text-2); border-radius: 8px; padding: 5px 10px; font-size: 11.5px; cursor: pointer; }
  .toolbar button:hover { color: var(--text); border-color: var(--border-strong); }
  .toolbar button.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); background: color-mix(in srgb, var(--accent) 7%, var(--bg)); }
  /* ---- inspector ---- */
  aside.inspector { border-left: 1px solid var(--border); min-height: 0; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .insp-head { padding: 19px 20px 15px; flex: none; }
  .insp-title { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; }
  .insp-title #iName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .insp-sub { color: var(--text-3); font-size: 11.5px; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .insp-tabs { display: flex; gap: 20px; padding: 0 20px; border-bottom: 1px solid var(--border); flex: none; overflow-x: auto; }
  .insp-tab { background: none; border: 0; padding: 6px 0 9px; color: var(--text-2); cursor: pointer; font-size: 12px; position: relative; white-space: nowrap; }
  .insp-tab.active { color: var(--text); }
  .insp-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
  .insp-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-gutter: stable; overflow-anchor: none; padding: 18px 20px 24px; }
  .kv { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 10px 12px; font-size: 12px; margin-bottom: 20px; }
  .kv .k { color: var(--text-3); }
  .kv .v { color: var(--text); overflow-wrap: anywhere; }
  .sect { color: var(--text-2); font-size: 11px; font-weight: 600; margin: 22px 0 10px; }
  .msg { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: var(--bg-elev); }
  .msg .h { display: flex; gap: 8px; color: var(--text-3); font-size: 10.5px; margin-bottom: 4px; overflow: hidden; }
  .msg .h span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg .b { font-size: 12px; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 120px; overflow: hidden; }
  details.collapse { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg-elev); }
  details.collapse > summary { cursor: pointer; color: var(--text-2); font-size: 11px; list-style: none; }
  details.collapse > summary::-webkit-details-marker { display: none; }
  details.collapse > summary::before { content: "▸ "; }
  details.collapse[open] > summary::before { content: "▾ "; }
  details.collapse > .c { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; color: var(--text-2); line-height: 1.8; max-height: 280px; overflow: auto; scrollbar-gutter: stable; margin-top: 10px; }
  table.calls { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
  table.calls th, table.calls td { text-align: right; padding: 9px 4px; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
  table.calls th:first-child, table.calls td:first-child { text-align: left; width: 36%; }
  table.calls th { color: var(--text-3); font-weight: 500; }
  table.calls th:nth-child(n+2), table.calls td:nth-child(n+2) { width: 16%; }
  .bar { height: 5px; border-radius: 3px; background: var(--bg-l2); overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--ok); }
  .muted { color: var(--text-3); }
  .warnbox { position: absolute; left: 16px; right: 16px; top: 10px; z-index: 5; border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--border)); background: var(--bg-elev); color: var(--warn); box-shadow: 0 4px 16px #0002; border-radius: 8px; padding: 10px 12px; font-size: 12px; }
  a { color: var(--accent); }
  @media (max-width: 1080px) { .body { grid-template-columns: minmax(0, 1fr) 320px; } }
  @media (max-width: 760px) {
    header.chrome { padding: 12px 16px; }
    .crumbs { flex-wrap: wrap; gap: 8px 12px; }
    .goal-btn { flex-basis: 45%; }
    .chips { width: 100%; margin-left: 0; }
    .body { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(220px, 46%) minmax(0, 1fr); }
    aside.inspector { border-left: 0; border-top: 1px solid var(--border); }
    .metrics { padding: 8px 4px; }
    .metric { flex-basis: 126px; }
    .insp-head { padding: 10px 16px; }
    .insp-tabs { padding: 0 16px; }
    .legend { display: none; }
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: var(--dsw-alias-bg-base, #f7f9fc); --bg-elev: var(--dsw-alias-bg-l1, #fff); --bg-l2: var(--dsw-alias-bg-l2, #edf1f7);
      --border: var(--dsw-alias-border-l2, #e0e6ef); --border-strong: var(--dsw-alias-border-l3, #c6d1df);
      --text: var(--dsw-alias-label-primary, #202c3f); --text-2: var(--dsw-alias-label-secondary, #526079); --text-3: var(--dsw-alias-label-tertiary, #68778d);
      --accent: var(--dsw-alias-brand-primary, #3969ce); --ok: #228366; --warn: #9a6b19; --bad: #c34855; }
  }
  @media (prefers-reduced-motion: reduce) { .st.RUNNING { animation: none; } }
</style>
</head>
<body>
<header class="chrome">
  <div class="crumbs">
    <b>HCCA · 智能体团队</b>
    <button id="goalBtn" class="goal-btn" aria-expanded="false" aria-controls="goalFull" title="展开 / 收起完整任务描述">
      <span id="goalText">正在读取任务…</span><span class="caret" id="goalCaret">▸</span>
    </button>
    <div class="chips">
      <span class="chip" id="chipStatus">连接中</span>
      <span class="chip" id="chipModel">读取模型</span>
      <span class="chip" id="chipAgents">读取智能体</span>
      <span class="dot" id="liveDot" hidden></span>
    </div>
  </div>
  <div class="goal-full" id="goalFull" hidden></div>
</header>

<section class="guidance" aria-label="运行中引导">
  <form id="guidanceForm">
    <label for="guidanceText">引导</label>
    <textarea id="guidanceText" rows="1" placeholder="补充要求会发送给活跃 Agent"></textarea>
    <button id="guidanceSend" type="submit" disabled>发送</button>
  </form>
  <div id="guidanceFeedback" role="status"></div>
  <div id="guidanceReceipts" class="guidance-receipts" aria-label="引导送达记录"></div>
</section>

<div class="body">
  <section class="canvas-wrap">
    <div class="metrics" id="metrics"></div>
    <div class="graph-area">
      <div class="warnbox" id="errorBox" role="status" hidden></div>
      <div class="canvas" id="canvas" aria-label="智能体协作结构图">
        <svg class="edges" id="edges" aria-hidden="true"></svg>
        <div class="empty" id="empty" hidden></div>
      </div>
      <div class="toolbar">
        <button id="followBtn" class="on" aria-pressed="true" title="自动选中正在运行的 Agent">跟随活动</button>
        <button id="fitBtn" title="回到结构图左上角">回到顶部</button>
      </div>
      <div class="legend">
        <span><i class="st" style="background:var(--warn)"></i>运行中</span>
        <span><i class="st" style="background:var(--accent)"></i>就绪</span>
        <span><i class="st" style="background:#a371f7"></i>等待</span>
        <span><i class="st" style="background:var(--ok)"></i>完成</span>
        <span><i class="st" style="background:var(--bad)"></i>失败</span>
      </div>
    </div>
  </section>

  <aside class="inspector">
    <div class="insp-head">
      <div class="insp-title"><span class="st" id="iDot"></span><span id="iName">选择一个 Agent</span></div>
      <div class="insp-sub" id="iSub">点击左侧结构图中的节点查看详情</div>
    </div>
    <div class="insp-tabs">
      <button class="insp-tab active" data-tab="overview">概览</button>
      <button class="insp-tab" data-tab="plan">任务</button>
      <button class="insp-tab" data-tab="context">上下文</button>
      <button class="insp-tab" data-tab="messages">消息</button>
      <button class="insp-tab" data-tab="calls">调用</button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </aside>
</div>

<script>
"use strict";
const state = {
  snapshot: null, selected: "root", follow: true, tab: "overview", timer: null,
  paused: false, nodeEls: new Map(), dragging: false, fetching: false,
  goalOpen: false, inspKey: "", views: new Map(), graphOrder: [], runId: null,
  connectionError: "", pendingSnapshot: null,
  guidanceSending: false, guidanceRequest: null, guidanceReceipts: [],
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (n) => (n ?? 0).toLocaleString("en-US");
const pct = (x) => `${((x ?? 0) * 100).toFixed(1)}%`;
const clampText = (s, max) => {
  const text = String(s ?? "");
  return text.length > max ? `${text.slice(0, max)}…` : text;
};

function normalize(s) {
  const snap = s || {};
  snap.agents = (snap.agents || []).filter((a) => a && a.agent_id);
  if (snap.external_root && !snap.agents.some((agent) => agent.external_controller)) {
    const rootId = snap.external_root_id || "dsh-root";
    const workerIds = new Set(snap.agents.map((agent) => agent.agent_id));
    snap.agents = [{ agent_id: rootId, display_name: snap.root_label || "DSH Root", role: "DSH 会话主控", status: "READY", external_controller: true,
      objective: "在 DSH 聊天中拆解任务、接收人类引导并整合子任务结果。" },
      ...snap.agents.map((agent) => ({ ...agent, parent_id: workerIds.has(agent.parent_id) ? agent.parent_id : rootId }))];
  }
  const jobs = [...(snap.executions || []), ...(snap.readings || [])];
  for (const agent of snap.agents) {
    const job = jobs.find((item) => item.agent_id === agent.agent_id);
    const assignment = (snap.plan?.agents || []).find((item) => item.name === agent.dimension || item.name === agent.agent_id);
    agent.objective = agent.objective || job?.task || assignment?.prompt || (!agent.parent_id ? snap.goal : "") || "";
    agent.next_step = agent.next_step || job?.next_step || "";
    agent.job_summary = job?.summary || "";
  }
  const byId = new Map(snap.agents.map((a) => [a.agent_id, a]));
  const edges = (snap.edges || []).filter((e) => byId.has(e.from) && byId.has(e.to));
  if (!edges.length) {
    for (const a of snap.agents) if (a.parent_id && byId.has(a.parent_id)) edges.push({ from: a.parent_id, to: a.agent_id, kind: "supervises" });
  }
  if (snap.external_root) {
    const rootId = snap.external_root_id || "dsh-root";
    for (const agent of snap.agents) {
      if (agent.parent_id === rootId && !edges.some((edge) => edge.from === rootId && edge.to === agent.agent_id)) {
        edges.push({ from: rootId, to: agent.agent_id, kind: "supervises" });
      }
    }
  }
  snap.edges = edges;
  return snap;
}

const PARAMS = new URLSearchParams(location.search);
const EMBED = PARAMS.has("embedded");
const SESSION = PARAMS.get("session") || "";
const API = EMBED ? "/api/hcca" : "/api";

function statusQuery(run) {
  const q = new URLSearchParams();
  if (run) q.set("run", run);
  else if (SESSION) q.set("session", SESSION);
  return q.toString() ? `?${q}` : "";
}

async function refresh() {
  if (document.hidden || state.paused || state.fetching) return;
  const run = PARAMS.get("run");
  if (EMBED && !SESSION && !run) {
    state.snapshot = normalize({ schema: "hcca.status.v1", status: "IDLE", agents: [], edges: [], messages: {}, tokens: {}, calls: [], events: [] });
    render();
    return;
  }
  state.fetching = true;
  try {
    const res = await fetch(`${API}/status${statusQuery(run)}`, { cache: "no-store", signal: AbortSignal.timeout(10000) });
    if (!res.ok) throw new Error(String(res.status));
    const next = normalize(await res.json());
    state.connectionError = "";
    if (state.paused || document.hidden) state.pendingSnapshot = next;
    else applySnapshot(next);
  } catch (err) {
    state.connectionError = `连接暂时中断，正在重试（${err?.message || err}）`;
    if (!state.snapshot) state.snapshot = normalize({ status: "OFFLINE", agents: [] });
    if (!state.paused && !document.hidden) render();
  } finally {
    state.fetching = false;
  }
}

function applySnapshot(next) {
  state.pendingSnapshot = null;
  const runId = next.run_id || "";
  if (state.runId !== runId) {
    state.runId = runId;
    state.views.clear();
    state.inspKey = "";
    state.graphOrder = [];
    state.selected = "root";
    state.goalOpen = false;
    for (const el of state.nodeEls.values()) el.remove();
    state.nodeEls.clear();
    $("canvas").scrollTo(0, 0);
    $("goalFull").scrollTop = 0;
    $("metrics").scrollLeft = 0;
  }
  state.snapshot = next;
  render();
}

function renderGuidance(snapshot) {
  const terminal = ["COMPLETED", "CLOSED", "FAILED", "CANCELLED", "INTERRUPTED", "INCOMPLETE", "IDLE", "OFFLINE"];
  const active = snapshot.run_id && !terminal.includes(String(snapshot.status || "").toUpperCase());
  $("guidanceText").hidden = Boolean(snapshot.external_root);
  $("guidanceSend").textContent = snapshot.external_root ? "在 DSH 聊天中引导" : "发送";
  $("guidanceSend").disabled = state.guidanceSending || (!snapshot.external_root && !active);
  const records = new Map(state.guidanceReceipts.map((item) => [`${item.run_id}:${item.guidance_id}`, item]));
  for (const item of snapshot.guidance || []) records.set(`${item.run_id}:${item.guidance_id}`, item);
  state.guidanceReceipts = [...records.values()];
  updateContent($("guidanceReceipts"), state.guidanceReceipts.slice(-5).reverse().map((item) => {
    const delivered = item.delivered_agent_ids || item.recipient_agent_ids || [];
    const pending = item.pending_agent_ids || [];
    const label = item.status === "delivered" ? "已送入输入" : "排队中";
    const recipients = delivered.length ? ` · ${delivered.join("、")}` : "";
    return `<p data-key="guidance-${esc(item.run_id)}-${esc(item.guidance_id)}">${label}${esc(recipients)}${pending.length ? ` · ${pending.length} 个待接收` : ""} · ${esc(item.message || item.text || "")}</p>`;
  }).join(""));
}

$("guidanceForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (state.snapshot?.external_root) {
    $("guidanceFeedback").textContent = "请切换到 DSH 聊天并发送补充要求，Root 会规划并调整相关子任务。";
    return;
  }
  const text = $("guidanceText").value;
  if (!text.trim() || state.guidanceSending) return;
  const snapshot = state.snapshot || {};
  const target = { run_id: snapshot.run_id, session: SESSION };
  const requestKey = JSON.stringify([target, text]);
  if (state.guidanceRequest?.key !== requestKey) {
    state.guidanceRequest = { key: requestKey, message_id: globalThis.crypto?.randomUUID?.() || `guidance-${Date.now()}-${Math.random().toString(16).slice(2)}` };
  }
  state.guidanceSending = true;
  $("guidanceSend").disabled = true;
  $("guidanceFeedback").textContent = "正在发送…";
  try {
    const response = await fetch(`${API}/guidance`, {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ ...target, text, message_id: state.guidanceRequest.message_id }),
      signal: AbortSignal.timeout(15000),
    });
    const receipt = await response.json();
    if (!response.ok) throw new Error(receipt.error || `HTTP ${response.status}`);
    const receipts = receipt.results || [receipt];
    state.guidanceReceipts.push(...receipts);
    $("guidanceText").value = "";
    state.guidanceRequest = null;
    $("guidanceFeedback").textContent = receipts.length ? "已接收，将在 Agent 下一次模型调用前送入。" : "当前没有活跃子任务。";
    renderGuidance(snapshot);
    void refresh();
  } catch (error) {
    $("guidanceFeedback").textContent = `发送失败，请重试。${error?.message || error}`;
  } finally {
    state.guidanceSending = false;
    renderGuidance(state.snapshot || {});
  }
});

function agentCalls(agentId) {
  return (state.snapshot.calls || []).filter((c) => c.agent_id === agentId);
}
function agentTokens(agentId) {
  const calls = agentCalls(agentId);
  return {
    input: calls.reduce((n, c) => n + (c.prompt_tokens || 0), 0),
    cached: calls.reduce((n, c) => n + (c.cache_hit_tokens || 0), 0),
    output: calls.reduce((n, c) => n + (c.completion_tokens || 0), 0),
    reasoning: calls.reduce((n, c) => n + (c.reasoning_tokens || 0), 0),
    complete: calls.every((c) => c.usage_complete !== false),
    cacheComplete: calls.every((c) => c.cache_usage_complete !== false && c.cache_hit_tokens != null),
  };
}
function agentTools(agentId) {
  // Per-Agent recent entries (the global log only keeps the last 40 calls, so
  // filtering it made busy Agents look idle once their calls scrolled out).
  const perAgent = (state.snapshot.tools && state.snapshot.tools.recent_by_agent) || {};
  if (perAgent[agentId]) return perAgent[agentId];
  const log = (state.snapshot.tools && state.snapshot.tools.log) || [];
  return log.filter((t) => t.agent_id === agentId);
}

function currentStep(agent) {
  if (agent.external_controller) return "在 DSH 聊天中管理子任务";
  const stages = { plan: "规划与拆解任务", research: "收集与分析资料", review: "复盘与整合结果", verify: "复核交付结果", report: "整理最终报告" };
  const status = statusOf(agent);
  if (["COMPLETED", "CLOSED"].includes(status)) return "任务已结束";
  if (["FAILED", "BLOCKED", "INCOMPLETE", "INTERRUPTED", "CANCELLED"].includes(status)) return statusLabel(status);
  const tool = (state.snapshot.pending_tools || []).find((item) => item.agent_id === agent.agent_id);
  if (tool) return `正在执行 ${tool.tool}`;
  if (pendingFor(agent.agent_id).length) return "正在调用模型";
  const explicit = (!agent.parent_id ? state.snapshot.root_stage : "") || agent.next_step;
  if (explicit) return stages[explicit] || explicit;
  if (agent.waiting_on) return "等待依赖任务或消息";
  if (status === "RUNNING") return "正在执行任务";
  return "等待调度";
}
function agentToolCount(agentId) {
  const counts = (state.snapshot.tools && state.snapshot.tools.per_agent) || {};
  if (counts[agentId]) return Number(counts[agentId].calls || 0);
  return agentTools(agentId).length;
}
function latestAudit(agentId) {
  const audits = (state.snapshot && state.snapshot.audits) || [];
  for (let index = audits.length - 1; index >= 0; index -= 1) {
    if (audits[index].agent_id === agentId) return audits[index];
  }
  return null;
}
function statusOf(agent) {
  if (agent.result_status) return String(agent.result_status).toUpperCase();
  // Older runs only have runtime state (CLOSED); recover the submitted status
  // from the event log so a finished agent does not look abnormally closed.
  const events = (state.snapshot && state.snapshot.events) || [];
  const submitted = events.find((e) => e.event === "submitted" && e.agent_id === agent.agent_id);
  if (String(agent.status || "").toUpperCase() === "CLOSED" && submitted && submitted.status) {
    return String(submitted.status).toUpperCase();
  }
  return String(agent.status || "").toUpperCase();
}

function render() {
  const s = state.snapshot; if (!s) return;
  renderGoal(s);
  renderGuidance(s);
  const st = String(s.status || "UNKNOWN").toUpperCase();
  $("chipStatus").textContent = state.connectionError ? "连接中断" : statusLabel(st);
  $("chipStatus").dataset.status = state.connectionError ? "OFFLINE" : st;
  const errorBox = $("errorBox");
  const errorText = state.connectionError || String(s.error || "");
  errorBox.hidden = !errorText;
  if (errorText) errorBox.textContent = errorText;
  $("chipModel").textContent = `${s.model || "模型待定"} · ${s.mode || "tools"}`;
  $("chipModel").title = $("chipModel").textContent;
  const workers = s.agents.filter((agent) => !agent.external_controller);
  const active = workers.filter((a) => ["RUNNING", "WAITING", "READY"].includes(String(a.status).toUpperCase())).length;
  $("chipAgents").textContent = `${workers.length} 个${s.external_root ? " HCCA worker" : "智能体"} · ${active} 活动`;
  $("liveDot").hidden = st !== "RUNNING" || Boolean(state.connectionError);
  if (state.follow) {
    const running = s.agents.find((a) => String(a.status).toUpperCase() === "RUNNING" && !a.parent_id)
      || s.agents.find((a) => String(a.status).toUpperCase() === "RUNNING");
    if (running) state.selected = running.agent_id;
  }
  if (!s.agents.some((a) => a.agent_id === state.selected)) state.selected = s.agents[0]?.agent_id || "root";
  renderMetrics(s);
  layoutGraph(s);
  renderInspector(s);
}

function renderGoal(s) {
  const goal = String(s.goal || s.run_id || "本会话尚未启动任务");
  const text = $("goalText");
  if (text.textContent !== goal) text.textContent = goal;
  const full = $("goalFull");
  full.hidden = !state.goalOpen;
  $("goalBtn").setAttribute("aria-expanded", String(state.goalOpen));
  $("goalCaret").textContent = state.goalOpen ? "▾" : "▸";
  if (state.goalOpen && full.textContent !== goal) full.textContent = goal;
}

function renderMetrics(s) {
  const t = s.tokens || {}, m = s.messages || {};
  const toolInfo = s.tools || {};
  const toolCount = toolInfo.calls ?? 0;
  const calls = s.calls || [];
  const input = Math.max(t.input || 0, calls.reduce((total, call) => total + (call.prompt_tokens || 0), 0));
  const complete = t.usage_complete !== false && calls.every((call) => call.usage_complete !== false);
  const cacheComplete = t.cache_usage_complete !== false && calls.every((call) => call.cache_usage_complete !== false);
  const costPending = calls.length && (!complete || !cacheComplete);
  const inputText = !complete && !input ? "等待用量" : fmt(input);
  const outputText = !complete && !t.output ? "等待用量" : fmt(t.output);
  const items = [
    ["耗时", `${Math.round(s.elapsed_s || 0)}s`],
    [s.external_root ? "Worker 输入 / 缓存" : "输入 / 缓存", `${inputText} <small>${cacheComplete ? pct(t.cache_hit_rate) : "缓存用量待补齐"}${complete ? "" : " · 已返回"}</small>`],
    [s.external_root ? "Worker 输出" : "输出", `${outputText} <small>${complete ? `含推理 ${fmt(t.reasoning)}` : "用量尚未完整返回"}</small>`],
    ["消息", `${fmt(m.sent)} / ${fmt(m.processed)} <small>唤醒 ${fmt(m.wakes)}</small>`],
    ["工具", toolInfo.enabled ? `${fmt(toolCount)} 次` : "未启用"],
    ["复盘 / 补派", `${(s.reviews || []).length} 轮`],
    ["进行中", `${(s.pending_calls || []).length} 调用 / ${(s.pending_tools || []).length} 工具${(s.pending_calls || []).some((p) => p.stalled) ? ` <small>等待重试 ${(s.pending_calls || []).filter((p) => p.stalled).length}</small>` : ""}`],
    [s.external_root ? "Worker 成本估算" : "成本估算", costPending ? `待补齐 <small>存在不完整用量</small>` : `$${(t.cost_estimate ?? 0).toFixed(4)}`],
  ];
  const html = items.map(([k, v]) => `<div class="metric"><div class="k">${k}</div><div class="v">${v}${v.includes("<small>") ? "" : "<small>&nbsp;</small>"}</div></div>`).join("");
  updateContent($("metrics"), html);
}

const WAIT_LABEL = { ALL_REQUIRED: "等全部", ANY_OF: "等任一", NEXT_EVENT: "等事件", ALL: "等全部" };
const STATUS_LABEL = { RUNNING: "运行中", READY: "就绪", WAITING: "等待中", COMPLETED: "已完成", FAILED: "失败", CANCELLED: "已取消", INCOMPLETE: "未完成", INTERRUPTED: "已中断", QUEUED: "排队中", CREATED: "已创建", IDLE: "待启动", OFFLINE: "连接中断", BLOCKED: "受阻", CLOSED: "已结束" };
const statusLabel = (status) => STATUS_LABEL[status] || status || "等待状态";

function recordKeys(items, identity) {
  const occurrences = new Map();
  return items.map((item) => {
    const base = String(identity(item));
    const occurrence = occurrences.get(base) || 0;
    occurrences.set(base, occurrence + 1);
    return { ...item, viewKey: `${base}:${occurrence}` };
  });
}

// Retain matching DOM nodes so polling preserves focus, selection, open state
// and nested scroll positions. Repeated records carry a stable data-key.
function updateContent(parent, html) {
  const template = document.createElement("template");
  template.innerHTML = html;
  patchChildren(parent, template.content);
}

function patchChildren(parent, desired) {
  const previous = [...parent.childNodes];
  const keyed = new Map(previous.filter((node) => node.nodeType === 1 && node.dataset.key).map((node) => [node.dataset.key, node]));
  const retained = new Set();
  let cursor = parent.firstChild;
  for (const incoming of desired.childNodes) {
    const key = incoming.nodeType === 1 ? incoming.dataset.key : "";
    let current = key ? keyed.get(key) : cursor;
    if (current && (current.nodeType !== incoming.nodeType || current.nodeName !== incoming.nodeName || (!key && current.nodeType === 1 && current.dataset.key))) current = null;
    if (!current) current = incoming.cloneNode(true);
    if (current !== cursor) parent.insertBefore(current, cursor);
    retained.add(current);
    if (incoming.nodeType === 3) {
      if (current.nodeValue !== incoming.nodeValue) current.nodeValue = incoming.nodeValue;
    } else if (incoming.nodeType === 1) {
      for (const attr of [...current.attributes]) {
        if (current.tagName === "DETAILS" && attr.name === "open") continue;
        if (!incoming.hasAttribute(attr.name)) current.removeAttribute(attr.name);
      }
      for (const attr of incoming.attributes) {
        if (current.tagName === "DETAILS" && attr.name === "open") continue;
        if (current.getAttribute(attr.name) !== attr.value) current.setAttribute(attr.name, attr.value);
      }
      patchChildren(current, incoming);
    }
    cursor = current.nextSibling;
  }
  for (const node of previous) if (!retained.has(node)) node.remove();
}

// In-flight model call detail: distinguishes "model is thinking" (chunk/text
// counters keep growing) from "gateway stalled" (keep-alives only, no output).
function pendingFor(agentId) {
  return ((state.snapshot && state.snapshot.pending_calls) || []).filter((p) => p.agent_id === agentId);
}

function pendingDetail(p) {
  const st = p.stream || {};
  const bits = [];
  if (p.stalled) bits.push(`<b style="color:var(--warn)">无进展 ${fmt(p.idle_s || 0)}s，等待重试</b>`);
  else if (p.idle_s) bits.push(`空闲 ${fmt(p.idle_s)}s`);
  const out = (st.content_chars || 0) + (st.reasoning_chars || 0);
  if (out) bits.push(`已输出 ${fmt(out)} 字符`);
  if (st.reasoning_chars) bits.push(`推理字段接收 ${fmt(st.reasoning_chars)} 字符`);
  if (st.chunks) bits.push(`${fmt(st.chunks)} 块`);
  return bits.join(" · ");
}

function nodeHtml(a) {
  const status = statusOf(a);
  const waitKind = String(a.waiting_on?.kind || "");
  const wait = waitKind ? `<span class="wait" title="wait ${esc(waitKind)}">${esc(WAIT_LABEL[waitKind] || "等待中")}</span>` : "";
  const stalled = pendingFor(a.agent_id).some((p) => p.stalled);
  const callMark = stalled
    ? `<span class="wait" style="color:var(--warn)" title="模型长时间无输出，正在重试">调用卡住</span>`
    : (a.in_call ? `<span class="wait">调用中</span>` : (a.in_tool ? `<span class="wait">工具中</span>` : ""));
  const label = a.dimension ? `${a.role} · ${a.dimension}` : a.role;
  return `<div class="row1"><svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>
    <span class="name">${esc(a.display_name || a.agent_id)}</span></div>
    <div class="role">${esc(label)}</div>
    <div class="foot"><span class="st ${esc(status)}"></span>${esc(statusLabel(status))} ${callMark} ${wait}</div>`;
}

function layoutGraph(s) {
  const canvas = $("canvas");
  const svg = $("edges");
  const empty = $("empty");
  const nodes = s.agents;
  if (!nodes.length) {
    empty.hidden = false;
    const status = String(s.status || "").toUpperCase();
    if (status === "FAILED" || s.error) {
      empty.textContent = "本次 HCCA 运行失败。\n" + (s.error || "请在 delegate.log 查看错误。");
    } else if (status === "OFFLINE") {
      empty.textContent = "正在重新连接 HCCA…";
    } else if (status === "IDLE") {
      empty.textContent = "本会话尚未启动 HCCA。\n在 HCCA 模式下让 Root 调用 hcca_delegate 后，结构图会实时出现。";
    } else {
      empty.textContent = "正在等待 Root 派发……";
    }
    for (const [, el] of state.nodeEls) el.remove();
    state.nodeEls.clear();
    svg.innerHTML = "";
    return;
  }
  empty.hidden = true;

  const width = Math.max(320, canvas.clientWidth || 900);
  const root = nodes.find((a) => !a.parent_id || a.depth === 0) || nodes[0];
  for (const a of nodes) if (!state.graphOrder.includes(a.agent_id)) state.graphOrder.push(a.agent_id);
  const byId = new Map(nodes.map((a) => [a.agent_id, a]));
  const children = state.graphOrder.filter((id) => id !== root.agent_id && byId.has(id)).map((id) => byId.get(id));
  const gap = 24, nodeW = 192, nodeH = 104, padX = 24, rootTop = 72, childTop = 246;
  const cols = Math.max(1, Math.floor((width - padX * 2 + gap) / (nodeW + gap)));
  const rows = Math.ceil(children.length / cols) || 0;
  const contentW = Math.max(width, Math.max(nodeW, cols * nodeW + Math.max(0, cols - 1) * gap) + padX * 2);
  const contentH = children.length ? childTop + rows * nodeH + Math.max(0, rows - 1) * gap + 72 : rootTop + nodeH + 72;

  const positions = new Map();
  positions.set(root.agent_id, { x: Math.round((width - nodeW) / 2), y: rootTop });
  children.forEach((a, i) => {
    const row = Math.floor(i / cols);
    const col = i % cols;
    const rowW = cols * nodeW + Math.max(0, cols - 1) * gap;
    positions.set(a.agent_id, {
      x: Math.round((width - rowW) / 2 + col * (nodeW + gap)),
      y: childTop + row * (nodeH + gap),
    });
  });

  // Preserve the user's scroll position across refreshes; only re-create nodes
  // that actually appear/disappear (old code wiped the DOM every 2.5s, which
  // made the graph flicker and impossible to drag).
  const scrollLeft = canvas.scrollLeft;
  const scrollTop = canvas.scrollTop;
  const alive = new Set(nodes.map((a) => a.agent_id));
  for (const [id, el] of [...state.nodeEls]) {
    if (!alive.has(id)) { el.remove(); state.nodeEls.delete(id); }
  }
  for (const a of nodes) {
    const pos = positions.get(a.agent_id);
    let el = state.nodeEls.get(a.agent_id);
    if (!el) {
      el = document.createElement("button");
      el.type = "button";
      el.className = "node";
      el.dataset.agent = a.agent_id;
      el.addEventListener("click", () => {
        state.selected = a.agent_id;
        stopFollowing();
        render();
      });
      canvas.appendChild(el);
      state.nodeEls.set(a.agent_id, el);
    }
    el.classList.toggle("selected", state.selected === a.agent_id);
    el.setAttribute("aria-pressed", String(state.selected === a.agent_id));
    el.setAttribute("aria-label", `${a.agent_id} · ${statusLabel(statusOf(a))}`);
    el.style.left = `${pos.x}px`;
    el.style.top = `${pos.y}px`;
    updateContent(el, nodeHtml(a));
  }

  // Edges are repainted cheaply (they are not interactive).
  svg.setAttribute("viewBox", `0 0 ${contentW} ${contentH}`);
  svg.style.width = `${contentW}px`;
  svg.style.height = `${contentH}px`;
  const edgeHtml = (s.edges || []).map((e) => {
    const from = positions.get(e.from), to = positions.get(e.to);
    if (!from || !to) return "";
    const x1 = from.x + nodeW / 2, y1 = from.y + nodeH, x2 = to.x + nodeW / 2, y2 = to.y;
    const my = (y1 + y2) / 2;
    const path = y2 > childTop && from.y === rootTop
      ? `M${x1},${y1} V${y1 + 22} H12 V${y2 - 12} H${x2} V${y2}`
      : `M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}`;
    const active = ["RUNNING", "WAITING", "READY"].includes(String(byId.get(e.to)?.status || "").toUpperCase());
    return `<path d="${path}" fill="none" stroke="${active ? "var(--accent)" : "var(--border-strong)"}" stroke-width="${active ? 1.6 : 1.2}" stroke-linejoin="round" stroke-dasharray="${active ? "" : "4 5"}"/>`;
  }).join("");
  if (svg.innerHTML !== edgeHtml) svg.innerHTML = edgeHtml;

  if (!state.dragging) {
    canvas.scrollLeft = scrollLeft;
    canvas.scrollTop = scrollTop;
  }
}

function renderInspector(s) {
  const agent = s.agents.find((a) => a.agent_id === state.selected) || s.agents[0];
  const body = $("inspBody");
  if (!agent) {
    $("iDot").className = "st";
    $("iName").textContent = "暂无数据";
    $("iSub").textContent = "等待 Root 派发任务";
    body.innerHTML = "";
    state.inspKey = "";
    return;
  }
  $("iDot").className = `st ${statusOf(agent)}`;
  $("iName").textContent = agent.display_name || agent.agent_id;
  $("iSub").textContent = [agent.role, agent.dimension, agent.task_id].filter(Boolean).join(" · ");
  if (agent.external_controller) {
    updateContent(body, `<div class="kv"><div class="k">主控</div><div class="v">DSH 聊天</div><div class="k">职责</div><div class="v">拆解任务、接收人类引导、整合子任务结果。</div><div class="k">用量</div><div class="v">请查看 DSH 会话用量。上方指标统计 HCCA worker。</div></div>`);
    state.inspKey = "external-root";
    return;
  }
  const key = `${agent.agent_id}|${state.tab}`;
  if (state.inspKey !== key) {
    const previous = state.views.get(state.inspKey);
    if (previous) {
      previous.scrollTop = body.scrollTop;
      previous.scrolls = [...previous.element.querySelectorAll(".c")].map((el) => [el, el.scrollTop, el.scrollLeft]);
    }
  }
  let view = state.views.get(key);
  if (!view) {
    view = { element: document.createElement("div"), scrollTop: 0, scrolls: [] };
    state.views.set(key, view);
  }
  const keepScroll = state.inspKey === key;
  const scrollTop = keepScroll ? body.scrollTop : view.scrollTop;
  // Anchor a visible record when newer messages are inserted above it.
  const anchor = keepScroll ? [...view.element.querySelectorAll("[data-key]")].find((el) => el.getBoundingClientRect().bottom > body.getBoundingClientRect().top) : null;
  const anchorTop = anchor?.getBoundingClientRect().top;
  const t = agentTokens(agent.agent_id);
  let html = "";
  if (state.tab === "overview") {
    const wait = agent.waiting_on ? `${WAIT_LABEL[agent.waiting_on.kind] || agent.waiting_on.kind}${(agent.waiting_on.refs || []).length ? ` · ${agent.waiting_on.refs.join(", ")}` : ""}` : "";
    const calls = agentCalls(agent.agent_id).length;
    const tools = agentTools(agent.agent_id);
    const toolCalls = agentToolCount(agent.agent_id);
    const toolNames = [...new Set(tools.map((tool) => tool.tool))].join(", ");
    const audit = latestAudit(agent.agent_id);
    const auditText = audit
      ? `<span style="color:${audit.status === "done" ? "inherit" : "var(--warn)"}">${esc(audit.status === "done" ? "已完成" : audit.status === "blocked" ? "被卡住" : "未完成")}</span>`
        + ((audit.missing || []).length ? ` · 缺 ${esc((audit.missing || []).slice(0, 3).join("；"))}${(audit.missing || []).length > 3 ? " …" : ""}` : "")
      : "";
    const runCalls = (state.snapshot.calls || []).length;
    const runTools = state.snapshot.tools?.calls ?? ((state.snapshot.tools && state.snapshot.tools.log) || []).length;
    const report = String(state.snapshot.report || "");
    const isRootAgent = !agent.parent_id;
    const objective = String(agent.objective || "");
    const planCount = (state.snapshot.plan?.agents || []).length || state.snapshot.agents.filter((item) => item.parent_id).length;
    const pending = pendingFor(agent.agent_id);
    const pendingInfo = pending.length
      ? pending.map((p) => `${esc(p.tag)} · ${fmt(p.elapsed_s || 0)}s · 第 ${fmt(p.attempt || 1)} 次${pendingDetail(p) ? ` · ${pendingDetail(p)}` : ""}`).join("<br>")
      : "";
    html = `
      <div class="kv">
        <div class="k">状态</div><div class="v"><span class="st ${esc(statusOf(agent))}"></span> ${esc(statusLabel(statusOf(agent)))}${agent.result_status && agent.status !== agent.result_status ? ` <span class="muted">(运行时 ${esc(agent.status)})</span>` : ""}</div>
        <div class="k">角色</div><div class="v">${esc(agent.role || "agent")} ${agent.dimension ? `· ${esc(agent.dimension)}` : ""}</div>
        ${wait ? `<div class="k">等待</div><div class="v">${esc(wait)}</div>` : ""}
        ${pendingInfo ? `<div class="k">调用中</div><div class="v">${pendingInfo}</div>` : ""}
        ${isRootAgent ? `<div class="k">拆分</div><div class="v">${planCount} 个子 Agent · 复盘 ${fmt((state.snapshot.reviews || []).length)} 轮</div>` : ""}
        <div class="k">当前进展</div><div class="v">${esc(currentStep(agent))}</div>
        <div class="k">调用</div><div class="v">${calls} 次 · ${fmt(t.input)} 输入 / ${fmt(t.output)} 输出${t.complete ? "" : " · 用量待补齐"}</div>
        <div class="k">工具</div><div class="v">${toolCalls} 次${toolNames ? ` · ${esc(toolNames)}` : ""}</div>
        ${auditText ? `<div class="k">交付验收</div><div class="v">${auditText}</div>` : ""}
        <div class="k">本 run 合计</div><div class="v">${runCalls} 次调用 · ${runTools} 次工具</div>
      </div>
      ${objective ? `<details class="collapse" data-key="objective" ${objective.length > 160 ? "" : "open"}>
        <summary>任务描述（${fmt(objective.length)} 字符）</summary>
        <div class="c">${esc(objective)}</div>
      </details>` : `<div class="muted">该历史运行未记录任务描述。</div>`}
      ${calls === 0 ? `<div class="muted" style="font-size:11.5px;margin-top:4px">${pending.length ? "首次模型调用进行中，用量将在返回后显示。" : "该智能体暂无已结算的模型调用。"}</div>` : ""}
      <div class="sect">缓存</div>
      ${t.input && t.cacheComplete ? `<div class="kv"><div class="k">命中率</div><div class="v">${pct(t.cached / t.input)}
        <div class="bar"><i style="width:${Math.round((t.cached / t.input) * 100)}%"></i></div></div></div>` : `<div class="muted">等待模型返回输入与缓存用量。</div>`}
      ${agent.job_summary ? `<details class="collapse" data-key="job-result" open><summary>任务结果</summary><div class="c">${esc(agent.job_summary)}</div></details>` : ""}
      ${isRootAgent && report ? `<details class="collapse" data-key="report"><summary>最终报告（${fmt(report.length)} 字符）</summary><div class="c">${esc(report)}</div></details>` : ""}`;
  } else if (state.tab === "context") {
    html = `
      <div class="sect">续执行状态</div>
      <div class="kv"><div class="k">当前进展</div><div class="v">${esc(currentStep(agent))}</div>
      <div class="k">层级深度</div><div class="v">${esc(agent.depth ?? (agent.parent_id ? 1 : 0))}</div>
      <div class="k">子 Agent</div><div class="v">${esc(s.agents.filter((item) => item.parent_id === agent.agent_id).map((item) => item.agent_id).join(", ") || "暂无子智能体")}</div></div>
      <div class="sect">说明</div>
      <div class="muted" style="font-size:11.5px">这些字段用于激活时重建工作集；完整事件请在「轨迹」或「调用」页查看。</div>`;
  } else if (state.tab === "plan") {
    const plan = s.plan || {};
    const agents = plan.agents || [];
    const reviews = s.reviews || [];
    const pending = (s.pending_calls || []).filter((p) => p.agent_id === agent.agent_id);
    const rows = agents.map((item, index) => `
      <details class="collapse" data-key="plan-${esc(item.name || index)}"><summary>${esc(item.name || "")} · Root 写的指令（${fmt(String(item.prompt || "").length)} 字符）</summary>
      <div class="c">${esc(item.prompt || "")}</div></details>`).join("");
    html = `
      <div class="kv"><div class="k">模式</div><div class="v">${esc(plan.mode || ((s.executions || []).length ? "直接执行" : "等待任务规划"))}${plan.verify ? " · 需要复验" : ""}</div>
      <div class="k">复盘轮次</div><div class="v">${fmt(s.review_round || 0)}</div>
      <div class="k">工作区</div><div class="v">${esc(s.workspace || s.tools?.workspace || "该运行未记录工作区")}</div></div>
      ${plan.verify_prompt ? `<details class="collapse" data-key="verify"><summary>Root 给复核者的要求</summary><div class="c">${esc(plan.verify_prompt)}</div></details>` : ""}
      <div class="sect">Root 拆解的任务</div>
      ${rows || `<div class="muted">本次为单 Agent 模式，没有拆分子任务。</div>`}
      ${reviews.length ? `<div class="sect">复盘 / 补派记录</div>` + reviews.map((r) => `<div class="msg" data-key="review-${esc(r.round)}"><div class="h"><b>第 ${esc(r.round)} 轮</b><span>${esc(r.decision)}</span></div><div class="b">${esc(r.reason || "")}${(r.agents || []).length ? ` · 补派：${esc((r.agents || []).join("、"))}` : ""}</div></div>`).join("") : ""}
      ${pending.length ? `<div class="sect">进行中</div>` + pending.map((p) => `<div class="msg" data-key="pending-${esc(p.tag)}"><div class="h"><b>${esc(p.tag)}</b><span>${fmt(p.elapsed_s || 0)}s</span><span>第 ${fmt(p.attempt || 1)} 次</span></div>${pendingDetail(p) ? `<div class="b">${pendingDetail(p)}</div>` : ""}</div>`).join("") : ""}`;
  } else if (state.tab === "messages") {
    const previews = (s.message_previews || []).filter((m) => {
      if (!agent.parent_id) return true;
      if (agent.role === "verifier") return m.kind === "note";
      return agent.dimension && String(m.subject || "").startsWith(agent.dimension);
    });
    if (previews.length) {
      html = recordKeys(previews, (m) => m.message_id || m.id || JSON.stringify([m.kind, m.subject, m.preview, m.chars])).slice(-12).reverse().map((m) => `
        <div class="msg" data-key="${esc(m.viewKey)}"><div class="h"><b>${esc(m.kind)}</b><span>${esc(m.subject || "")}</span><span>${fmt(m.chars)} 字符</span></div>
        <div class="b" style="white-space:pre-wrap">${esc(m.preview || "")}${(m.chars || 0) > (m.preview || "").length ? "\n…" : ""}</div></div>`).join("");
    } else {
      const events = (s.events || []).filter((e) => e.event === "message_sent" && (e.agent_id === agent.agent_id || (e.recipients || []).includes(agent.agent_id)));
      html = events.length ? events.slice(-12).reverse().map((e) => `
        <div class="msg" data-key="${esc(e.message_id)}"><div class="h"><b>${esc(e.kind || "")}</b><span>${esc(e.agent_id || "")}</span><span>${esc(e.message_id || "")}</span></div>
        <div class="b">→ ${esc((e.recipients || []).join(", "))}</div></div>`).join("") : `<div class="muted">该 Agent 暂无消息记录。</div>`;
    }
  } else {
    const calls = agentCalls(agent.agent_id);
    const tools = agentTools(agent.agent_id);
    const pending = (s.pending_calls || []).filter((p) => p.agent_id === agent.agent_id);
    const pendingTools = (s.pending_tools || []).filter((p) => p.agent_id === agent.agent_id);
    const pendingRows = pending.map((p) => `
      <div class="msg" data-key="pending-${esc(p.tag)}"><div class="h"><b>${p.stalled ? `<span style="color:var(--warn)">调用卡住</span>` : "进行中"}</b><span>${esc(p.tag)}</span><span>${fmt(p.elapsed_s || 0)}s · 第 ${fmt(p.attempt || 1)} 次</span></div>${pendingDetail(p) ? `<div class="b">${pendingDetail(p)}</div>` : ""}</div>`).join("");
    const pendingToolRows = pendingTools.map((p) => `
      <div class="msg" data-key="pending-tool-${esc(p.tool)}"><div class="h"><b>工具进行中</b><span>${esc(p.tool)}</span><span>${fmt(p.elapsed_s || 0)}s</span></div></div>`).join("");
    const toolRows = recordKeys(tools, (tool) => tool.tool_call_id || tool.call_id || JSON.stringify([tool.started_at, tool.tag, tool.tool, tool.args, tool.chars, tool.duration_ms])).slice(-12).reverse().map((tool) => `
      <div class="msg" data-key="${esc(tool.viewKey)}"><div class="h"><b>${esc(tool.tool)}</b><span>${tool.ok === false ? "失败" : "成功"}</span><span>${fmt(tool.chars)} 字符</span></div>
      <div class="b">${esc(Object.entries(tool.args || {}).map(([k, v]) => `${k}=${v}`).join(" · ") || "")}</div></div>`).join("");
    html = pendingRows + pendingToolRows
      + (calls.length ? `<table class="calls"><thead><tr><th>阶段</th><th>输入</th><th>命中</th><th>输出</th><th>耗时</th></tr></thead><tbody>${calls.map((c) => `
      <tr><td title="${esc(c.tag || "")}">${esc(String(c.tag || "").replace(/^analyst-/, ""))}</td><td>${fmt(c.prompt_tokens)}</td><td>${fmt(c.cache_hit_tokens)}</td>
      <td>${fmt(c.completion_tokens)}</td><td>${(c.latency_s ?? 0).toFixed(1)}s</td></tr>`).join("")}</tbody></table>` : (pending.length ? "" : `<div class="muted">暂无调用。</div>`))
      + (tools.length ? `<div class="sect">工具调用</div>${toolRows}` : "");
  }
  updateContent(view.element, html);
  if (!keepScroll) {
    body.replaceChildren(view.element);
    for (const [el, top, left] of view.scrolls) {
      el.scrollTop = top;
      el.scrollLeft = left;
    }
  }
  body.scrollTop = scrollTop + (anchor?.isConnected ? anchor.getBoundingClientRect().top - anchorTop : 0);
  state.inspKey = key;
}

document.querySelectorAll(".insp-tab").forEach((btn) => btn.addEventListener("click", () => {
  stopFollowing();
  state.tab = btn.dataset.tab;
  document.querySelectorAll(".insp-tab").forEach((b) => b.classList.toggle("active", b === btn));
  if (state.snapshot) renderInspector(state.snapshot);
}));
// Optional deep link: ?tab=plan|context|messages|calls
const initialTab = PARAMS.get("tab");
if (initialTab && ["overview", "plan", "context", "messages", "calls"].includes(initialTab)) {
  state.tab = initialTab;
  document.querySelectorAll(".insp-tab").forEach((b) => b.classList.toggle("active", b.dataset.tab === initialTab));
}
$("followBtn").addEventListener("click", () => {
  state.follow = !state.follow;
  $("followBtn").classList.toggle("on", state.follow);
  $("followBtn").setAttribute("aria-pressed", String(state.follow));
  if (state.follow && state.snapshot) render();
});
$("fitBtn").addEventListener("click", () => { const c = $("canvas"); c.scrollTo({ left: 0, top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "instant" : "smooth" }); });
$("goalBtn").addEventListener("click", () => {
  state.goalOpen = !state.goalOpen;
  renderGoal(state.snapshot || {});
});
window.addEventListener("resize", () => render());

// ---- drag to pan the graph (scrollbars are not enough with many agents) ----
const canvasEl = $("canvas");
let drag = null;
canvasEl.addEventListener("pointerdown", (event) => {
  if (event.target.closest(".node") || event.target.closest(".toolbar") || event.button !== 0) return;
  drag = { x: event.clientX, y: event.clientY, left: canvasEl.scrollLeft, top: canvasEl.scrollTop };
  state.dragging = true;
  canvasEl.classList.add("panning");
  canvasEl.setPointerCapture?.(event.pointerId);
});
canvasEl.addEventListener("pointermove", (event) => {
  if (!drag) return;
  canvasEl.scrollLeft = drag.left - (event.clientX - drag.x);
  canvasEl.scrollTop = drag.top - (event.clientY - drag.y);
});
const endDrag = () => {
  if (!drag) return;
  drag = null;
  state.dragging = false;
  canvasEl.classList.remove("panning");
};
canvasEl.addEventListener("pointerup", endDrag);
canvasEl.addEventListener("pointercancel", endDrag);
canvasEl.addEventListener("lostpointercapture", endDrag);

// Pause live updates while the user is dragging/scrolling the canvas or inspector.
function stopFollowing() {
  state.follow = false;
  $("followBtn").classList.remove("on");
  $("followBtn").setAttribute("aria-pressed", "false");
}

const interaction = new Set();
let wheelTimer;
function setInteraction(reason, active) {
  if (active) interaction.add(reason);
  else interaction.delete(reason);
  state.paused = interaction.size > 0;
  if (!state.paused) {
    if (state.pendingSnapshot) {
      const next = state.pendingSnapshot;
      state.pendingSnapshot = null;
      applySnapshot(next);
    }
    refresh();
  }
}
document.addEventListener("pointerdown", (event) => {
  setInteraction("pointer", true);
  if (event.target.closest(".inspector")) stopFollowing();
}, true);
const releasePointer = () => { endDrag(); setInteraction("pointer", false); };
window.addEventListener("pointerup", releasePointer);
window.addEventListener("pointercancel", releasePointer);
document.addEventListener("wheel", (event) => {
  if (event.target.closest(".inspector")) stopFollowing();
  setInteraction("wheel", true);
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => setInteraction("wheel", false), 600);
}, { passive: true, capture: true });
document.addEventListener("selectionchange", () => {
  const selection = getSelection();
  const reading = Boolean(selection && !selection.isCollapsed && $("inspBody").contains(selection.anchorNode));
  if (reading) stopFollowing();
  setInteraction("selection", reading);
});
window.addEventListener("blur", () => { setInteraction("blur", true); releasePointer(); });
window.addEventListener("focus", () => { interaction.delete("pointer"); setInteraction("blur", false); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });

refresh();
state.timer = setInterval(refresh, 2500);
</script>
</body>
</html>
