name: Offline checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -ra -W error::pytest.PytestUnhandledThreadExceptionWarning
      - run: node integrations/dsh-hcca/tests/offline.mjs
